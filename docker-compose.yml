services:
  db:
    image: postgres:17
    container_name: maxxing_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: maxxing
      POSTGRES_USER: maxxing
      POSTGRES_PASSWORD: maxxing_dev_password
    # Sadece bu bilgisayardan erişilir; aynı ağdaki başkaları bağlanamaz (şifre repoda açık).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - maxxing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxxing -d maxxing"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Geliştirmede giden mailler burada yakalanır, gerçek adrese gitmez. Gelen kutusu: http://localhost:8025
  mail:
    image: axllent/mailpit:v1.27
    container_name: maxxing_mail
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  maxxing_pgdata:
